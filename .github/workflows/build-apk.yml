name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Project me gradlew / wrapper jar nahi hai, isliye Gradle khud install karte hain
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # .env gitignored hai, isliye secret se banate hain
      - name: Create .env from secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      # build.gradle.kts debug.keystore maangta hai (gitignored)
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AHI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
