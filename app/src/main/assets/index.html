<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenStream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  #stream-container {
    width: 100%;
    max-width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stream {
    max-width: 100%;
    max-height: 100vh;
    display: block;
  }
  #status {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #status.visible { opacity: 1; }
  #controls {
    position: fixed;
    bottom: 16px;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  body:hover #controls { opacity: 1; }
  button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    backdrop-filter: blur(4px);
  }
  button:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div id="stream-container">
  <img id="stream" src="{{stream_address}}" alt="Screen Stream"
       onerror="onStreamError()" onload="onStreamLoad()">
</div>
<div id="status"></div>
<div id="controls">
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <button onclick="reloadStream()">↺ Reload</button>
</div>

<script>
  var streamEl = document.getElementById('stream');
  var statusEl = document.getElementById('status');
  var statusTimer;

  function showStatus(msg, ms) {
    statusEl.textContent = msg;
    statusEl.classList.add('visible');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function() {
      statusEl.classList.remove('visible');
    }, ms || 2000);
  }

  function onStreamLoad() { showStatus('Connected', 1500); }
  function onStreamError() {
    showStatus('Stream disconnected — retrying…', 4000);
    setTimeout(reloadStream, 3000);
  }

  function reloadStream() {
    var src = streamEl.src.split('?')[0];
    streamEl.src = src + '?t=' + Date.now();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
</html>
